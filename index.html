<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Browse and copy 16Bit_HER0 SFX commands, preview sound effects, and check their PX cost."
  />
  <title>16Bit_HER0 SFX</title>
  <link rel="icon" type="image/png" sizes="any" href="https://16bither0.github.io/sfx/avatar.png" crossorigin="anonymous">

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="16Bit_HER0 SFX" />
  <meta property="og:title" content="16Bit_HER0 SFX" />
  <meta
    property="og:description"
    content="Browse SFX commands, preview sound effects, copy commands, and check their PX cost."
  />
  <meta property="og:url" content="https://16bither0.github.io/sfx/" />
  <meta property="og:image" content="https://16bither0.github.io/sfx/avatar.png" />
  <meta property="og:image:width" content="150" />
  <meta property="og:image:height" content="150" />
  <meta property="og:image:alt" content="16Bit_HER0 avatar" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="16Bit_HER0 SFX" />
  <meta
    name="twitter:description"
    content="Browse SFX commands, preview sound effects, copy commands, and check their PX cost."
  />
  <meta name="twitter:image" content="https://16bither0.github.io/sfx/avatar.png" />
  <meta name="theme-color" content="#3B1A7D" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Roboto:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1 class="title">
      <img
        src="avatar.gif"
        alt="16Bit_HER0 avatar"
        class="avatar"
      />
      <span>16Bit_HER0 SFX</span>
    </h1>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search command or description.." />
      <button
        id="clear-search"
        class="clear-search"
        type="button"
        aria-label="Clear search"
        title="Clear search"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
    <span id="counter" class="counter"></span>
  </div>

  <main>
    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>No results</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
